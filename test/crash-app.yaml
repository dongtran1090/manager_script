apiVersion: apps/v1
kind: Deployment
metadata:
  name: crash-app
  namespace: chaos-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: crash-app
  template:
    metadata:
      labels:
        app: crash-app
    spec:
      containers:
      - name: crash-app
        image: busybox:1.36
        command: ["sh", "-c", "echo crash && exit 1"]