apiVersion: apps/v1
kind: Deployment
metadata:
  name: bad-api
  namespace: chaos-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: bad-api
  template:
    metadata:
      labels:
        app: bad-api
    spec:
      containers:
      - name: bad-api
        image: python:3.11-alpine
        command: ["python", "-c"]
        args:
          - |
            from http.server import BaseHTTPRequestHandler, HTTPServer
            class H(BaseHTTPRequestHandler):
                def do_GET(self):
                    self.send_response(500)
                    self.end_headers()
                    self.wfile.write(b"API broken but process still alive")
            HTTPServer(("0.0.0.0", 8080), H).serve_forever()
        ports:
        - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: bad-api
  namespace: chaos-demo
spec:
  selector:
    app: bad-api
  ports:
    - port: 8080
      targetPort: 8080
  type: ClusterIP