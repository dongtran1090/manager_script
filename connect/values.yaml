controller:
  admin:
    username: admin
    password: "dongtran123"

  serviceType: ClusterIP
  servicePort: 8080
  jenkinsUrl: "http://jenkins.jenkins.svc.cluster.local:8080"
  agentListenerServiceType: ClusterIP

  installPlugins:
    - kubernetes:4423.vb_59f230b_ce53
    - workflow-aggregator:608.v67378e9d3db_1
    - git:5.10.1
    - configuration-as-code:2061.vc08919f7fc37

  installLatestPlugins: false
  initializeOnce: true
  overwritePlugins: true
  overwritePluginsFromImage: true

agent:
  enabled: true
  useDefaultServiceAccount: false
  serviceAccount: jenkins-agent-admin
  podTemplates:
    kubectl: |
      - name: kubectl
        label: kubectl
        serviceAccount: jenkins-agent-admin
        containers:
          - name: kubectl
            image: bitnami/kubectl:latest
            command: "/bin/sh -c"
            args: "sleep 99d"
            ttyEnabled: true

rbac:
  create: true

persistence:
  enabled: true