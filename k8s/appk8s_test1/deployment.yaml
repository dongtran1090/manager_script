apiVersion: apps/v1
kind: Deployment
metadata:
  name: appk8s-test1
  namespace: demo-test1
spec:
  replicas: 2
  selector:
    matchLabels:
      app: appk8s-test1
  template:
    metadata:
      labels:
        app: appk8s-test1
    spec:
      containers:
      - name: appk8s-test1
        image: nginx:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 80